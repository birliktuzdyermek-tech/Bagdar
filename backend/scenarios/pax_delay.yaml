# Обязательный сценарий: пассажирский поезд опаздывает и меняет очерёдность.
id: pax_delay
title: Опоздание скорого
summary: >
  Скорый пассажирский задерживается на 15 минут, позже скоростной — ещё на 8.
  Бағдар переносит скрещения на другие разъезды и меняет порядок пропуска,
  чтобы старшие поезда не вышли за допуск, а грузовые не простаивали зря.
