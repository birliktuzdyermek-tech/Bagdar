# Первая волна, № 1 «Замок».
id: lock
title: Замок
summary: >
  Однопутный участок с короткими разъездами. Четыре длинных грузовых (больше
  километра) входят навстречу друг другу. Длинный состав помещается не на каждом
  разъезде: если двое встанут на соседних станциях с одним длинным путём каждая,
  никто не сможет двинуться. Без диспетчерского плана (поезда по расписанию,
  защищает только СЦБ) за три часа девять поездов стоят на месте больше часа.
  Бағдар проверяет на две станции вперёд, что встречному останется путь нужной
  длины, и придерживает поезд заранее; исполнитель соблюдает плановый порядок
  приёма на пути.
plain: "Четыре очень длинных поезда едут навстречу. Без умного плана они встают «замком» и никто не может двинуться. Бағдар это предвидит и придерживает один поезд заранее."
