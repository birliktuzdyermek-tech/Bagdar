# Первая волна, № 15 «Эффект бабочки».
id: butterfly
title: Эффект бабочки
summary: >
  Один скорый опоздал всего на 4 минуты. В плотном графике опоздание расходится
  по скрещениям на других поездов. Карточка показывает дерево распространения —
