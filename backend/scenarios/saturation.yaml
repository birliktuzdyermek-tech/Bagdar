# Первая волна, № 13 «Тихое насыщение».
id: saturation
title: Тихое насыщение
summary: >
  Ничего не ломается. Просто каждые полчаса приходит пара лишних грузовых,
  и поездов чуть больше, чем участок способен пропустить. Очереди растут на
