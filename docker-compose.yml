# Бағдар одной командой: docker compose up --build
# Сайт, API и витрина на одном порту: http://localhost:8000
#   /                     экран диспетчера
#   /docs                 Swagger API
#   /showcase/index.html  витрина: презентация, ситуации, записи прогонов
services:
  bagdar:
    build: .
    image: bagdar:local
    ports:
      - "${BAGDAR_PORT:-8000}:10000"
    environment:
      PORT: "10000"
      BAGDAR_SCENARIO: "${BAGDAR_SCENARIO:-normal}"
      BAGDAR_LOG_LEVEL: "${BAGDAR_LOG_LEVEL:-INFO}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:10000/api/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
